<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="title" content="3D Cube - For You | Made with Love">
	<link rel="stylesheet" href="./css/program.css">
	<title>For You 💗</title>
</head>

<body>
	<canvas id="hearts-bg"></canvas>

	<div class="vignette"></div>

	<div class="title">
		<span class="title-main">Youu.... 🫵🏼🥹💗</span>
		<span class="title-sub">every side, every angle — still you</span>
	</div>

	<div class="stage">
		<div class="aura"></div>
		<div class="ring ring-1"></div>
		<div class="ring ring-2"></div>
		<div class="ring ring-3"></div>

		<div class="cube">
			<div class="outer-cube">
				<div class="outer-top"><img src="images/z1.jpg" /></div>
				<div class="outer-bottom"><img src="images/z3.jpg" /></div>
				<div class="outer-front"><img src="images/z2.jpg" /></div>
				<div class="outer-back"><img src="images/z1.jpg" /></div>
				<div class="outer-left"><img src="images/z3.jpg" /></div>
				<div class="outer-right"><img src="images/z2.jpg" /></div>
			</div>
			<div class="inner-cube">
				<div class="inner-top"><img src="images/z1.jpg" /></div>
				<div class="inner-bottom"><img src="images/z3.jpg" /></div>
				<div class="inner-front"><img src="images/z2.jpg" /></div>
				<div class="inner-back"><img src="images/z1.jpg" /></div>
				<div class="inner-left"><img src="images/z3.jpg" /></div>
				<div class="inner-right"><img src="images/z2.jpg" /></div>
			</div>

			<div class="core">
				<div class="heart"></div>
			</div>
		</div>

		<div class="floor-glow"></div>
	</div>

	<div class="message">
		<div class="tip">tap anywhere to send love ✨</div>
	</div>

	<script src="js/love.js"></script>
</body>

</html>
